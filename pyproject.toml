[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doubletake"
version = "0.1.0"
description = "Intake validation for initiative submissions, built around dates that read two ways"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
doubletake = "initiative_hub.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
# The en and em dashes in the range regex are deliberate: people genuinely type "5000-8000" with
# one, and rejecting those would push a real range into FREE_TEXT for the wrong reason.
"src/initiative_hub/fields.py" = ["RUF001", "RUF003"]

[tool.coverage.run]
source = ["initiative_hub"]
branch = true
